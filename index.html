<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUN - Coming Soon</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4eee1; /* لون البيج الرملي الخاص ببراند BRUN */
            color: #003366; /* اللون النيلي الرسمي */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 450px;
            width: 90%;
        }

        /* تنسيق صورة البراند الجديدة */
        .brand-image {
            width: 100%;
            max-width: 320px;
            height: auto;
            margin-bottom: 15px;
            border-radius: 15px;
        }

        h1 {
            font-size: 2.8rem;
            margin: 5px 0;
            letter-spacing: 4px;
            font-weight: bold;
        }

        .coming-soon {
            font-size: 1.4rem;
            color: #e67e22; /* لون الشمس البرتقالي */
            margin-bottom: 35px;
            font-weight: bold;
        }

        /* كرت التواصل الأبيض */
        .contact-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .contact-item {
            margin-bottom: 25px;
        }

        .label {
            display: block;
            font-size: 1rem;
            margin-bottom: 10px;
            color: #444;
        }

        .email-link {
            font-size: 1.15rem;
            color: #003366;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid #003366;
        }

        /* زر الوتساب الأخضر بإطار أسود حسب طلبك */
        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #25D366;
            color: white;
            padding: 14px;
            border-radius: 40px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.2rem;
            border: 2px solid #000000;
            transition: transform 0.2s ease;
        }

        .whatsapp-btn:hover {
            transform: scale(1.05);
            background-color: #1ebd5e;
        }

    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.ibb.co/VpgXvHm/351291756.jpg" alt="BRUN Brand" class="brand-image">

        <h1>BRUN</h1>
        <p class="coming-soon">☀️ ...coming soon</p>

        <div class="contact-card">
            <div class="contact-item">
                <span class="label">للإستفسارات عبر الإيميل:</span>
                <a href="mailto:brun.b.sa@gmail.com" class="email-link">brun.b.sa@gmail.com</a>
            </div>

            <div class="contact-item">
                <span class="label">تواصل عبر الواتساب:</span>
                <a href="https://wa.me/966563901181" class="whatsapp-btn" target="_blank">
                    ابدأ المحادثة (0563901181)
                </a>
            </div>
        </div>
    </div>

</body>
</html>
