<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUN - Coming Soon</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4eee1; /* لون بيج رملي */
            color: #003366; /* لون نيلي */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 450px;
            width: 90%;
        }

        /* تنسيق صورة البراند من الرابط المرسل */
        .brand-image {
            width: 100%;
            max-width: 300px;
            height: auto;
            margin-bottom: 10px;
            border-radius: 10px; /* زوايا ناعمة للصورة */
        }

        h1 {
            font-size: 2.2rem;
            margin: 10px 0;
            letter-spacing: 3px;
        }

        .coming-soon {
            font-size: 1.3rem;
            color: #e67e22; /* لون شمسي */
            margin-bottom: 30px;
            font-weight: bold;
        }

        .contact-card {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .contact-item {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #666;
        }

        .email-link {
            font-size: 1.1rem;
            color: #003366;
            text-decoration: none;
            font-weight: bold;
        }

        /* زر الوتساب الأخضر */
        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #25D366;
            color: white;
            padding: 12px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .whatsapp-btn:hover {
            transform: scale(1.03);
        }

    </style>
</head>
<body>

    <div class="container">
        <img src="https://ibb.co/Q7M8DdZd" alt="BRUN Brand" class="brand-image">

        <h1>BRUN</h1>
        <p class="coming-soon">coming soon...☀️</p>

        <div class="contact-card">
            <div class="contact-item">
                <span class="label">للإستفسارات عبر الإيميل:</span>
                <a href="mailto:brun.b.sa@gmail.com" class="email-link">brun.b.sa@gmail.com</a>
            </div>

            <div class="contact-item">
                <span class="label">تواصل عبر الواتساب:</span>
                <a href="https://wa.me/966563901181" class="whatsapp-btn" target="_blank">
                    ابدأ المحادثة (0563901181)
                </a>
            </div>
        </div>
    </div>

</body>
</html>
